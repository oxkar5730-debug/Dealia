<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealia - Cazador de Chollos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- TOP BAR -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 z-20 shrink-0 shadow-xs">
        <div class="flex items-center space-x-3">
            <button id="menu-btn" class="w-10 h-10 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-rose-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-rose-500/20">
                    <i class="fa-solid fa-tag text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">Dealia</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-rose-50 text-rose-600 font-semibold px-2.5 py-1 rounded-full border border-rose-100">v1.0.0</span>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- SIDEBAR LATERAL -->
        <div id="sidebar" class="absolute inset-y-0 left-0 w-72 bg-white border-r border-slate-200 shadow-xl z-30 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-rose-500/20">
                        <i class="fa-solid fa-tag"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-900">Menú Dealia</h2>
                        <p class="text-xs text-slate-500">Tu asistente de compras</p>
                    </div>
                </div>
                <button id="close-menu" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="switchView('home')" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium transition-all">
                    <i class="fa-solid fa-camera-retro w-5 text-center"></i>
                    <span>Tasador IA</span>
                </button>
                <button onclick="switchView('search')" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium transition-all">
                    <i class="fa-solid fa-magnifying-glass-dollar w-5 text-center"></i>
                    <span>Buscador Multi-Web</span>
                </button>
            </nav>
        </div>

        <div id="overlay" class="absolute inset-0 bg-slate-900/20 backdrop-blur-xs z-20 hidden transition-opacity"></div>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <!-- VISTA: TASADOR IA -->
            <div id="view-home" class="view-container flex-1 flex flex-col h-full max-w-3xl mx-auto w-full bg-white shadow-sm border-x border-slate-200">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-robot text-sm"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-slate-900 text-sm">Tasador IA</h2>
                            <p class="text-xs text-emerald-600 font-medium">● Listo</p>
                        </div>
                    </div>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50/50">
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 text-xs font-bold">AI</div>
                        <div class="bg-white border border-slate-200 p-3.5 rounded-2xl rounded-tl-xs shadow-xs max-w-md text-sm text-slate-700">
                            ¡Hola! Pulsa el botón <b>+</b> para subir foto.
                        </div>
                    </div>
                </div>
                <div id="image-preview-container" class="px-4 py-3 bg-white border-t border-slate-100 hidden flex items-center space-x-3">
                    <img id="img-preview" src="" alt="Preview" class="w-12 h-12 object-cover rounded-lg border border-slate-200">
                    <div class="flex-1">
                        <p class="text-xs font-semibold text-slate-700">Imagen lista</p>
                    </div>
                    <button onclick="removeImage()" class="text-slate-400 hover:text-rose-500 text-xs font-medium"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="p-4 bg-white border-t border-slate-200 shrink-0">
                    <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center bg-slate-100 rounded-2xl px-3 py-2 border border-slate-200 focus-within:ring-2 focus-within:ring-rose-500/20">
                        <label class="w-9 h-9 rounded-xl hover:bg-slate-200 text-slate-500 flex items-center justify-center cursor-pointer shrink-0 mr-2">
                            <i class="fa-solid fa-plus text-sm"></i>
                            <input type="file" id="chat-file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                        </label>
                        <input type="text" id="chat-input" placeholder="Escribe algo..." class="flex-1 bg-transparent border-none focus:outline-none text-sm text-slate-800">
                        <button type="submit" class="w-9 h-9 rounded-xl bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center shrink-0 ml-2">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- VISTA: BUSCADOR -->
            <div id="view-search" class="view-container flex-1 hidden flex flex-col max-w-3xl mx-auto w-full p-6 overflow-y-auto">
                <h2 class="text-2xl font-bold text-slate-900">Buscador Multi-Web</h2>
                <div class="mt-6 flex space-x-2">
                    <input type="text" id="search-query" placeholder="¿Qué buscas?" class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm">
                    <button onclick="performSearch()" class="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-xl text-sm">Buscar</button>
                </div>
                <div id="search-results" class="mt-6 space-y-3"></div>
            </div>
        </main>
    </div>

    <!-- SCRIPT CORREGIDO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const closeMenu = document.getElementById('close-menu');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');

            function toggleMenu() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            menuBtn.addEventListener('click', toggleMenu);
            closeMenu.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        });

        function switchView(viewId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('overlay').classList.add('hidden');
        }

        // ... (resto de funciones de chat y búsqueda que ya tenías)
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-preview').src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }
        function removeImage() {
            document.getElementById('chat-file-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }
        function handleChatSubmit(e) {
            e.preventDefault();
            // Lógica...
            alert("Enviado (Simulado)");
        }
        function performSearch() {
            const query = document.getElementById('search-query').value;
            if(!query) return;
            window.open('https://es.wallapop.com/search?keywords=' + encodeURIComponent(query), '_blank');
        }
    </script>
</body>
</html>
