<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealia - Cazador de Chollos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] flex flex-col overflow-hidden">

    <!-- TOP BAR -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 z-30 shrink-0 shadow-xs relative">
        <div class="flex items-center space-x-3">
            <!-- Botón con Z-INDEX extremo -->
            <button id="menu-btn" type="button" class="w-12 h-12 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 transition-colors z-[9999] relative">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-rose-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-rose-500/20">
                    <i class="fa-solid fa-tag text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">Dealia</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-rose-50 text-rose-600 font-semibold px-2.5 py-1 rounded-full border border-rose-100">v1.0.1</span>
        </div>
    </header>

    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-slate-200 shadow-2xl z-[100] transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-rose-500/20">
                    <i class="fa-solid fa-tag"></i>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900">Menú Dealia</h2>
                </div>
            </div>
            <button id="close-menu" type="button" class="w-12 h-12 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <button onclick="switchView('home')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium transition-all">
                <i class="fa-solid fa-camera-retro w-5 text-center"></i>
                <span>Tasador IA</span>
            </button>
            <button onclick="switchView('search')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-rose-50 hover:text-rose-600 font-medium transition-all">
                <i class="fa-solid fa-magnifying-glass-dollar w-5 text-center"></i>
                <span>Buscador Multi-Web</span>
            </button>
        </nav>
    </div>

    <!-- OVERLAY -->
    <div id="overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-[90] hidden transition-opacity"></div>

    <!-- MAIN -->
    <div class="flex flex-1 relative overflow-hidden">
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <div id="view-home" class="view-container flex-1 flex flex-col h-full max-w-3xl mx-auto w-full bg-white shadow-sm border-x border-slate-200">
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50/50">
                    <div class="flex items-start space-x-3">
                        <div class="bg-white border border-slate-200 p-3.5 rounded-2xl rounded-tl-xs shadow-xs max-w-md text-sm text-slate-700">
                            ¡Hola! Bienvenido. Estoy listo para ayudarte.
                        </div>
                    </div>
                </div>
                <div class="p-4 pb-20 bg-white border-t border-slate-200 shrink-0">
                    <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center bg-slate-100 rounded-2xl px-3 py-2 border border-slate-200">
                        <input type="text" id="chat-input" placeholder="Pregunta..." class="flex-1 bg-transparent border-none focus:outline-none text-sm py-1">
                        <button type="submit" class="w-9 h-9 rounded-xl bg-rose-500 text-white flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </form>
                </div>
            </div>
            <div id="view-search" class="view-container flex-1 hidden p-6">
                <h2 class="text-2xl font-bold">Buscador</h2>
            </div>
        </main>
    </div>

    <script>
        console.log("Script cargado correctamente");

        const menuBtn = document.getElementById('menu-btn');
        const closeMenu = document.getElementById('close-menu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            console.log("Toggle ejecutado");
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Añadimos tanto click como touchstart para máxima compatibilidad móvil
        [menuBtn, closeMenu, overlay].forEach(el => {
            if(el) {
                el.addEventListener('click', (e) => { e.preventDefault(); toggleMenu(); });
                el.addEventListener('touchstart', (e) => { e.preventDefault(); toggleMenu(); });
            }
        });

        function switchView(viewId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            toggleMenu();
        }

        function handleChatSubmit(e) { e.preventDefault(); }
    </script>
</body>
</html>
